[project]
name = "agent-evaluation"
version = "0.1.0"
description = "Agent evaluation framework comparison based on tau-bench"
requires-python = ">=3.13"
dependencies = [
    "strands-agents",
    "strands-agents[openai]",
    "strands-agents[litellm]",
    "strands-agents-tools",
    "langfuse",
    "litellm",
    "python-dotenv",
    "boto3",
    "tau-bench",
    # Evaluation frameworks
    "mlflow[genai]>=3.3",
    "openevals",
    "agentevals",
    "deepeval",
    "langchain-aws>=1.3.1",
    "aiobotocore>=3.2.0",
]

[tool.uv.sources]
tau-bench = { path = "./tau-bench" }
